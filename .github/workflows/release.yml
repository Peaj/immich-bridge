name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\ImmichBridge\ImmichBridge.csproj
          $projectVersion = $project.Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $userscriptVersion = (Select-String -Path .\userscript\immich-bridge.user.js -Pattern '^// @version\s+(.+)$').Matches[0].Groups[1].Value.Trim()
          $extensionManifest = Get-Content .\browser-extension\manifest.json -Raw | ConvertFrom-Json
          $extensionVersion = $extensionManifest.version
          $chromiumManifest = Get-Content .\browser-extension\manifest.chromium.json -Raw | ConvertFrom-Json
          $chromiumExtensionVersion = $chromiumManifest.version

          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }

          if ($userscriptVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match userscript version $userscriptVersion."
          }

          if ($extensionVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Firefox extension version $extensionVersion."
          }

          if ($chromiumExtensionVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Chromium extension version $chromiumExtensionVersion."
          }

      - name: Restore
        run: dotnet restore .\ImmichBridge.slnx

      - name: Build
        run: dotnet build .\ImmichBridge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\ImmichBridge.slnx --configuration Release --no-build

      - name: Check userscript syntax
        run: node --check .\userscript\immich-bridge.user.js

      - name: Check extension syntax
        run: npm run check:extension

      - name: Lint browser extensions
        run: npm run lint:extension

      - name: Build Firefox extension
        run: npm run build:firefox-extension

      - name: Build Chromium extension
        run: npm run build:chromium-extension

      - name: Build Edge extension
        run: npm run build:edge-extension

      - name: Publish win-x64
        run: >
          dotnet publish .\src\ImmichBridge\ImmichBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          --output .\artifacts\ImmichBridge-win-x64

      - name: Add release support files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\ImmichBridge-win-x64\userscript | Out-Null
          New-Item -ItemType Directory -Force .\artifacts\ImmichBridge-win-x64\browser-extension | Out-Null
          Copy-Item .\userscript\immich-bridge.user.js .\artifacts\ImmichBridge-win-x64\userscript\immich-bridge.user.js
          Copy-Item .\browser-extension\* .\artifacts\ImmichBridge-win-x64\browser-extension -Recurse
          Copy-Item .\README.md .\artifacts\ImmichBridge-win-x64\README.md
          Copy-Item .\PRIVACY.md .\artifacts\ImmichBridge-win-x64\PRIVACY.md
          Copy-Item .\CHANGELOG.md .\artifacts\ImmichBridge-win-x64\CHANGELOG.md

      - name: Package release artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path .\artifacts\ImmichBridge-win-x64\* -DestinationPath ".\artifacts\ImmichBridge-win-x64-$version.zip" -Force
          Copy-Item .\userscript\immich-bridge.user.js ".\artifacts\immich-bridge-$version.user.js"
          $builtFirefoxExtension = Get-ChildItem .\artifacts\browser-extension -Filter *.zip | Select-Object -First 1
          $builtChromiumExtension = Get-ChildItem .\artifacts\chromium-extension -Filter *.zip | Select-Object -First 1
          $builtEdgeExtension = Get-ChildItem .\artifacts\edge-extension -Filter *.zip | Select-Object -First 1
          Copy-Item $builtFirefoxExtension.FullName ".\artifacts\immich-bridge-firefox-$version.zip"
          Copy-Item $builtChromiumExtension.FullName ".\artifacts\immich-bridge-chromium-$version.zip"
          Copy-Item $builtEdgeExtension.FullName ".\artifacts\immich-bridge-edge-$version.zip"
          Get-ChildItem .\artifacts -File |
            Where-Object { $_.Name -like "*.zip" -or $_.Name -like "*.user.js" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content .\artifacts\SHA256SUMS.txt

      - name: Extract release notes
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content .\CHANGELOG.md
          $heading = "## $tagVersion"
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($line) $line.Trim() -eq $heading })

          if ($start -lt 0) {
            throw "Could not find changelog section '$heading'."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^##\s+') {
              $end = $index
              break
            }
          }

          $releaseNotes = $lines[$start..($end - 1)]
          if (-not ($releaseNotes | Where-Object { $_.Trim().Length -gt 0 })) {
            throw "Changelog section '$heading' is empty."
          }

          New-Item -ItemType Directory -Force .\artifacts | Out-Null
          $releaseNotes | Set-Content .\artifacts\RELEASE_NOTES.md

      - name: Upload browser store packages
        uses: actions/upload-artifact@v4
        with:
          name: browser-store-packages-${{ github.ref_name }}
          path: |
            artifacts/immich-bridge-firefox-${{ github.ref_name }}.zip
            artifacts/immich-bridge-chromium-${{ github.ref_name }}.zip
            artifacts/immich-bridge-edge-${{ github.ref_name }}.zip
            artifacts/RELEASE_NOTES.md
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/ImmichBridge-win-x64-${{ github.ref_name }}.zip
            artifacts/immich-bridge-${{ github.ref_name }}.user.js
            artifacts/immich-bridge-firefox-${{ github.ref_name }}.zip
            artifacts/immich-bridge-chromium-${{ github.ref_name }}.zip
            artifacts/immich-bridge-edge-${{ github.ref_name }}.zip
            artifacts/SHA256SUMS.txt

  publish-firefox:
    name: Submit Firefox extension
    needs: release
    if: ${{ needs.release.result == 'success' && vars.PUBLISH_FIREFOX_EXTENSION == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit to Mozilla Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_CHANNEL: listed
          WEB_EXT_APPROVAL_TIMEOUT: 0
        run: >
          npx --yes web-ext sign
          --source-dir browser-extension
          --artifacts-dir artifacts/firefox-signed
          --amo-metadata browser-extension/amo-metadata.json

  publish-chrome:
    name: Submit Chrome extension
    needs: release
    if: ${{ needs.release.result == 'success' && vars.PUBLISH_CHROME_EXTENSION == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download browser store packages
        uses: actions/download-artifact@v4
        with:
          name: browser-store-packages-${{ github.ref_name }}
          path: artifacts/store-packages

      - name: Submit to Chrome Web Store
        env:
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: node scripts/publish-chrome-extension.js "artifacts/store-packages/immich-bridge-chromium-${{ github.ref_name }}.zip"

  publish-edge:
    name: Submit Edge extension
    needs: release
    if: ${{ needs.release.result == 'success' && vars.PUBLISH_EDGE_EXTENSION == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download browser store packages
        uses: actions/download-artifact@v4
        with:
          name: browser-store-packages-${{ github.ref_name }}
          path: artifacts/store-packages

      - name: Submit to Microsoft Edge Add-ons
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CERTIFICATION_NOTES: Automated update for ${{ github.ref_name }}. Source and release notes are available at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}.
        run: node scripts/publish-edge-extension.js "artifacts/store-packages/immich-bridge-edge-${{ github.ref_name }}.zip"
