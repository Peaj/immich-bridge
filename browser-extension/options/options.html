<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immich Bridge</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>Immich Bridge</h1>
      <p class="intro">Connect this extension to your Immich web app. Access is requested only for the Immich site you enter here.</p>

      <form id="settings-form">
        <label for="immich-url">Immich URL</label>
        <div class="field-row">
          <input id="immich-url" name="immich-url" type="url" placeholder="https://photos.example.com" autocomplete="url" required>
          <button type="submit">Save</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <a id="open-immich" class="link-button" href="#" target="_blank" rel="noreferrer">Open Immich</a>
        <button id="remove-permission" type="button" class="secondary">Remove access</button>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
